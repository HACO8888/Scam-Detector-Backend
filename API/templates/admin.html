<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <title>管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs" defer></script>
</head>

<body class="bg-gray-100 text-gray-800">

  <script>
    window.currentUserEmail = "{{ user_email }}";
  </script>

  <div class="max-w-5xl mx-auto p-6">

    <h1 class="text-3xl font-bold mb-6">管理後台</h1>
    <p class="mb-4">
      登入帳號：<b>{{ user_email }}</b>
      {% if user_is_admin %}<span class="text-green-700">(管理員)</span>{% endif %}
    </p>

    <!-- User Table -->
    <div class="bg-white shadow rounded-lg p-4 mb-8">
      <div class="flex justify-between mb-3 items-center">
        <h2 class="text-xl font-semibold">使用者列表</h2>
        <button onclick="loadUsers()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
          重新整理
        </button>
      </div>

      <table class="w-full border-collapse text-sm">
        <thead>
          <tr class="bg-gray-200 text-left">
            <th class="p-2">ID</th>
            <th class="p-2">Email</th>
            <th class="p-2">姓名</th>
            <th class="p-2">Active</th>
            <th class="p-2">Admin</th>
            <th class="p-2">操作</th>
          </tr>
        </thead>
        <tbody id="user-table"></tbody>
      </table>
    </div>

    <!-- Add User -->
    <div class="bg-white shadow rounded-lg p-4">
      <h2 class="text-xl font-semibold mb-3">新增使用者</h2>

      <form onsubmit="createUser(event)" class="space-y-3">
        <div class="flex flex-col gap-2 md:flex-row">
          <input id="new-email" class="border p-2 rounded w-full" placeholder="email" required>
          <input id="new-fullname" class="border p-2 rounded w-full" placeholder="full name">
          <input id="new-password" class="border p-2 rounded w-full" placeholder="password">
        </div>

        <div class="flex items-center gap-4">
          <label class="flex items-center gap-2">
            <input id="new-active" type="checkbox" checked>
            <span>Active</span>
          </label>

          <label class="flex items-center gap-2">
            <input id="new-admin" type="checkbox">
            <span>Admin</span>
          </label>

          <button class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700" type="submit">
            新增
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 w-96 shadow-lg">
      <h3 class="text-xl font-semibold mb-4">編輯使用者</h3>

      <input id="edit-id" type="hidden">

      <label class="block mb-3 text-sm">
        <span class="block mb-1">Email（不可修改）</span>
        <input id="edit-email" class="border p-2 rounded w-full bg-gray-200" disabled>
      </label>

      <label class="block mb-3 text-sm">
        <span class="block mb-1">姓名</span>
        <input id="edit-fullname" class="border p-2 rounded w-full">
      </label>

      <label class="block mb-3 text-sm">
        <span class="block mb-1">新密碼（可留空，不修改）</span>
        <input id="edit-password" class="border p-2 rounded w-full" placeholder="不修改請留空">
      </label>

      <div class="flex items-center gap-4 mb-4 text-sm">
        <label class="flex items-center gap-2">
          <input id="edit-active" type="checkbox">
          <span>Active</span>
        </label>

        <label class="flex items-center gap-2">
          <input id="edit-admin" type="checkbox">
          <span>Admin</span>
        </label>
      </div>

      <div class="flex justify-between">
        <button onclick="closeModal()" class="px-4 py-2 bg-gray-400 rounded text-white hover:bg-gray-500">
          取消
        </button>
        <button onclick="saveEdit()" class="px-4 py-2 bg-blue-600 rounded text-white hover:bg-blue-700">
          儲存
        </button>
      </div>
    </div>
  </div>

  <script>
    async function loadUsers() {
      const res = await fetch('/users', { credentials: 'include' });
      if (!res.ok) {
        alert('載入使用者失敗');
        return;
      }

      const data = await res.json();
      const tbody = document.getElementById('user-table');
      tbody.innerHTML = '';

      data.forEach(u => {
        const tr = document.createElement('tr');
        tr.className = "border-b hover:bg-gray-50";

        const isSelf = u.email === window.currentUserEmail;

        let actionsHtml =
          `<button class="px-2 py-1 bg-yellow-500 text-white rounded hover:bg-yellow-600 mr-1" onclick="openEdit(${u.id})">編輯</button>`;

        if (isSelf) {
          actionsHtml +=
            `<button class="px-2 py-1 bg-gray-400 text-white rounded cursor-not-allowed" disabled>刪除自己</button>`;
        } else {
          actionsHtml +=
            `<button class="px-2 py-1 bg-red-600 text-white rounded hover:bg-red-700" onclick="deleteUser(${u.id})">刪除</button>`;
        }

        tr.innerHTML = `
        <td class="p-2">${u.id}</td>
        <td class="p-2">${u.email}</td>
        <td class="p-2">${u.full_name || ''}</td>
        <td class="p-2">${u.is_active}</td>
        <td class="p-2">${u.is_admin}</td>
        <td class="p-2">
          ${actionsHtml}
        </td>
      `;
        tbody.appendChild(tr);
      });
    }

    async function openEdit(id) {
      const res = await fetch(`/users/${id}`, { credentials: 'include' });
      if (!res.ok) {
        alert('載入使用者失敗');
        return;
      }
      const u = await res.json();

      document.getElementById('edit-id').value = u.id;
      document.getElementById('edit-email').value = u.email;
      document.getElementById('edit-fullname').value = u.full_name || '';
      document.getElementById('edit-active').checked = u.is_active;
      document.getElementById('edit-admin').checked = u.is_admin;
      document.getElementById('edit-password').value = '';

      const isSelf = u.email === window.currentUserEmail;
      document.getElementById('edit-active').disabled = isSelf;  // 自己不能關掉自己的 active

      const modal = document.getElementById('edit-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('edit-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function saveEdit() {
      const id = document.getElementById('edit-id').value;

      const body = {
        full_name: document.getElementById('edit-fullname').value,
        is_active: document.getElementById('edit-active').checked,
        is_admin: document.getElementById('edit-admin').checked,
      };

      const newPwd = document.getElementById('edit-password').value;
      if (newPwd.trim()) {
        body.password = newPwd;
      }

      const res = await fetch(`/users/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.detail || '更新失敗');
        return;
      }

      closeModal();
      loadUsers();
    }

    async function createUser(e) {
      e.preventDefault();

      const body = {
        email: document.getElementById('new-email').value,
        full_name: document.getElementById('new-fullname').value,
        password: document.getElementById('new-password').value,
        is_active: document.getElementById('new-active').checked,
        is_admin: document.getElementById('new-admin').checked,
      };

      const res = await fetch('/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.detail || '新增失敗');
        return;
      }

      document.getElementById('new-email').value = '';
      document.getElementById('new-fullname').value = '';
      document.getElementById('new-password').value = '';
      document.getElementById('new-active').checked = true;
      document.getElementById('new-admin').checked = false;

      loadUsers();
    }

    async function deleteUser(id) {
      if (!confirm(`確定刪除 user ${id}？`)) return;

      const res = await fetch(`/users/${id}`, {
        method: 'DELETE',
        credentials: 'include',
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.detail || '刪除失敗');
        return;
      }

      loadUsers();
    }

    loadUsers();
  </script>

</body>

</html>
